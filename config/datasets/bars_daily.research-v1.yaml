dataset: bars_daily
schema_version: research-v1
required_fields:
  - instrument
  - datetime
  - open
  - high
  - low
  - close
  - volume
  - amount
owners: {}
primary_source: tdx
row_policy:
  verified_only: true
  allow_unverified: false
  lifecycle_auxiliary_sources: [akshare, adata]
  allow_unknown_missing: false
  raw_capture: true
cross_validation:
  close:
    compare_with: tushare
    max_abs_diff_pct: 0.001
  volume:
    compare_with: tushare
    max_rel_diff_pct: 0.01
# cr.md U12 + 2026-10-10 residual R2: the rules above are OPTIONAL — they
# execute only when a run requests cross-validation (uq-ingest daily
# --cross-validate / build_tushare_crosscheck_pipeline); the default
# TDX-only path legitimately skips them. Set to "required" to make every
# run from this contract enforce them; a pipeline that skips a required
# mode fails at construction.
cross_validation_mode: optional
# Fraction of primary rows that must be comparable against the comparator
# source when cross-validation runs, below which the run is rejected.
minimum_coverage: 0.9
sources:
  tdx:
    priority: 1
    provides: [instrument, datetime, open, high, low, close, volume, amount]
  tushare:
    priority: 2
    fallback: true
    provides: [instrument, datetime, open, high, low, close, volume, amount]
