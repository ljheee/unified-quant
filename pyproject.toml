[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-quant"
version = "0.1.0"
description = "Canonical pluggable quant data framework"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.1,<3",
  "pyarrow>=14",
  "PyYAML>=6.0",
  "jsonschema>=4,<5",
  "cryptography>=44",
]

[project.scripts]
uq-ingest = "uq.cli:uq_ingest"
uq-research-run = "uq.research_chain.cli:uq_research_run"

[project.optional-dependencies]
real = [
  "mootdx>=0.11,<0.12",
  "tushare>=1.4",
]
dev = [
  "pytest>=8",
  "pyarrow>=14",
  "scikit-learn>=1.3",
  "joblib>=1.3",
]
qlib = [
  "pyqlib==0.9.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
